[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-customer-intelligence"
version = "1.0.0"
description = "Production-Grade Retail Customer Intelligence & Recommendation Platform"
authors = [{ name = "Machine Learning Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "implicit>=0.7.2",
    "mlflow>=2.10.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "joblib>=1.3.2",
    "pyarrow>=15.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyrefly]
search-path = [".", "src"]
disable-search-path-heuristics = true
project-includes = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
project-excludes = ["notebooks/**", "**/*.ipynb"]



